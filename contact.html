<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="blur1"></div>
    <div class="blur2"></div>

    <div class="contact-container">

        <h1 class="heading">Contact Me</h1>

        <p class="contact-text">
            Feel free to contact me for projects,
            collaborations, internships, or opportunities.
        </p>

        <div class="info">
            <h3>📧 Email</h3>
            <p>khushis71534@gmail.com</p>

            <h3>📱 Phone</h3>
            <p>+91 92535 71534</p>
        </div>

        <form class="contact-form">

            <input
                type="text"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                placeholder="Your Email"
                required
            >

            <textarea
                placeholder="Your Message"
                rows="6"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</body>
</html>
